[build]
  base = "packages/nouns-webapp"
  command = "pnpm build"
  publish = "dist"
  # `edge_functions` is resolved relative to the netlify.toml location
  # (repo root), NOT to `base` — keep this in sync with where the source
  # files actually live (packages/nouns-webapp/netlify/edge-functions).
  edge_functions = "packages/nouns-webapp/netlify/edge-functions"

# Explicit edge function declarations — without these the CLI's auto
# discovery doesn't ship the function on every deploy path (notably
# `--no-build`).
[[edge_functions]]
  function = "og-proposal"
  path = "/vote/:id"

[[edge_functions]]
  function = "og-proposal"
  path = "/candidates/:id"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200