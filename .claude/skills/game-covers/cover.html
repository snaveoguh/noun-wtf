<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Rubik+Mono+One&family=Permanent+Marker&display=block" rel="stylesheet">
<style>
@font-face{font-family:'Pip3';src:url(../../../packages/nouns-webapp/public/fonts/Pip3-Regular.931624c1.woff2) format('woff2')}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:960px;overflow:hidden;background:#000}
.c{position:relative;width:1200px;height:960px;overflow:hidden;border:14px solid #0b0b0f}
.bg{position:absolute;inset:0;background:var(--bg)}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,.18) 2.4px,transparent 2.6px);background-size:16px 16px;
  -webkit-mask-image:linear-gradient(160deg,#000 0%,transparent 70%);mask-image:linear-gradient(160deg,#000 0%,transparent 70%)}
.burst{position:absolute;inset:-30%;background:repeating-conic-gradient(from 0deg at 72% 58%,rgba(255,255,255,.13) 0 6deg,transparent 6deg 16deg)}
.blob{position:absolute;border-radius:46% 54% 60% 40%/50% 42% 58% 50%;border:6px solid #0b0b0f}
.shot{position:absolute;filter:brightness(var(--br,1.5)) saturate(1.3) contrast(1.05);left:var(--sx);top:var(--sy);width:var(--sw);aspect-ratio:5/4;transform:rotate(var(--sr));
  border:10px solid #fff;outline:7px solid #0b0b0f;box-shadow:22px 26px 0 #0b0b0f;background:#222 center/cover no-repeat;background-image:var(--img)}
.shot::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.08),transparent 40%,rgba(0,0,0,.18))}
.title{position:absolute;left:42px;top:34px;font-family:'Pip3';text-transform:uppercase;font-size:var(--ts,200px);line-height:.8;color:#fff;
  -webkit-text-stroke:9px #0b0b0f;paint-order:stroke fill;letter-spacing:.01em;transform:rotate(-4deg);
  text-shadow:8px 8px 0 #ff2f8e,15px 15px 0 #20d6ff,22px 22px 0 #0b0b0f}
.title .l2{color:var(--accent);display:block;margin-left:var(--l2x,60px)}
.tag{position:absolute;right:46px;bottom:96px;font-family:'Rubik Mono One';font-size:34px;color:var(--accent);background:#0b0b0f;
  padding:12px 22px;transform:rotate(-2deg);box-shadow:8px 8px 0 #ff2f8e}
.url{position:absolute;right:58px;bottom:38px;font-family:'Rubik Mono One';font-size:24px;color:#fff;background:#ff2f8e;padding:9px 18px;
  transform:rotate(-2deg);border:4px solid #0b0b0f}
.badge{position:absolute;left:44px;bottom:40px;width:150px;height:150px;border-radius:50%;background:var(--badge,#ff2f8e);border:7px solid #0b0b0f;
  display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-10deg);box-shadow:8px 8px 0 #0b0b0f}
.badge svg{width:96px}
.badge b{font-family:'Permanent Marker';font-size:20px;color:#fff;-webkit-text-stroke:1px #0b0b0f;margin-top:4px}
.prop{position:absolute;filter:drop-shadow(10px 12px 0 #0b0b0f)}
.prop svg{width:100%;display:block}
.speed{position:absolute;height:12px;border-radius:6px;background:#0b0b0f}
.cap{position:absolute;font-family:'Permanent Marker';font-size:36px;color:#0b0b0f;transform:rotate(var(--r,6deg))}
</style></head>
