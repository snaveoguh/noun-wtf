    <!-- Pip3 is the site font (self-hosted @font-face in index.css). These are
         the missing-glyph fallbacks only: Comic Neue for the Dice/abacus theme
         (Comic Sans MS isn't available on iOS/Android), JetBrains Mono for the
         Terminal theme. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

    <!-- Anti-flash theme bootstrap — set data-theme on <html> before paint
         so CSS variable resolution doesn't visibly shift during hydration.
         Mirrors SiteThemeContext.getInitialState; keep them in sync. -->
    <script>
      (function () {
        try {
          var THEMES = ['abacus', 'terminal'];
          var params = new URLSearchParams(window.location.search);
          var themeParam = params.get('theme');
          var modeParam = params.get('mode');
          var theme = null;
          if (themeParam && THEMES.indexOf(themeParam) !== -1) {
            theme = themeParam;
          } else if (modeParam === 'terminal' || modeParam === 'new') {
            theme = 'terminal';
          } else if (window.Telegram && window.Telegram.WebApp) {
            theme = 'terminal';
          } else if (window.farcaster) {
            theme = 'terminal';
          } else {
            var stored = localStorage.getItem('noun-wtf-theme');
            if (stored && THEMES.indexOf(stored) !== -1) {
              theme = stored;
            } else {
              var legacy = localStorage.getItem('noun-wtf-site-mode');
              if (legacy === 'new') theme = 'terminal';
            }
          }
          document.documentElement.setAttribute('data-theme', theme || 'abacus');
        } catch (_) {
          document.documentElement.setAttribute('data-theme', 'abacus');
        }
      })();
    </script>
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#e04639" />
    <meta name="msapplication-TileColor" content="#2b5797" />
    <meta name="theme-color" content="#ffffff" />

    <title>Nouns DAO</title>

    <script>
      // Handle stale chunk loading errors (after new deploys, old cached bundles reference non-existent chunks)
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('Failed to fetch dynamically imported module') || e.message.includes('Loading chunk') || e.message.includes('Importing a module script failed'))) {
          if (!sessionStorage.getItem('chunk_reload')) {
            sessionStorage.setItem('chunk_reload', '1');
            window.location.reload();
          }
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && e.reason.message && (e.reason.message.includes('Failed to fetch dynamically imported module') || e.reason.message.includes('Loading chunk') || e.reason.message.includes('Importing a module script failed'))) {
          if (!sessionStorage.getItem('chunk_reload')) {
            sessionStorage.setItem('chunk_reload', '1');
            window.location.reload();
          }
        }
      });
    </script>
