name: Forge (noun-world-chain)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/noun-world-chain/**'
      - '.github/workflows/noun-world-chain.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/noun-world-chain/**'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/noun-world-chain
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build
        run: forge build

      - name: Test
        run: forge test -vv
