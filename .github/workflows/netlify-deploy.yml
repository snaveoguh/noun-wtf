name: Netlify Deploy

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select site
        id: site
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "site_id=${{ secrets.NETLIFY_SITE_PROD }}" >> "$GITHUB_OUTPUT"
            echo "context=production" >> "$GITHUB_OUTPUT"
            echo "prod=true" >> "$GITHUB_OUTPUT"
          else
            echo "site_id=${{ secrets.NETLIFY_SITE_STAGING }}" >> "$GITHUB_OUTPUT"
            echo "context=branch:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prod=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build workspace dependencies
        run: |
          pnpm --filter @nouns/sdk build
          pnpm --filter @nouns/assets build

      - name: Build with Netlify context
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ steps.site.outputs.site_id }}
          NODE_OPTIONS: --max-old-space-size=4096
          # Both staging and main run on mainnet now — sepolia testing was
          # too flaky. NounV2 contracts are mainnet-only, so staging has to
          # be mainnet to exercise them.
          VITE_CHAIN_ID: '1'
          VITE_MAINNET_JSONRPC: "https://ethereum-rpc.publicnode.com"
          VITE_MAINNET_SUBGRAPH: ${{ secrets.VITE_MAINNET_SUBGRAPH }}
          VITE_WALLET_CONNECT_V2_PROJECT_ID: ${{ secrets.VITE_WALLET_CONNECT_V2_PROJECT_ID }}
          VITE_ETHERSCAN_API_KEY: ${{ secrets.VITE_ETHERSCAN_API_KEY }}
          VITE_DASHBOARD_API_KEY: ${{ secrets.VITE_DASHBOARD_API_KEY }}
          # NounV2 mainnet contract addresses (public, safe to hardcode)
          VITE_NOUNV2_TOKEN_ADDRESS: '0xb1d6bdf9326dd09183c2e9d25af5e22c637293b9'
          VITE_NOUNV2_AUCTION_HOUSE_ADDRESS: '0x9a6ddb16e23967d5482e5bfd7444a04a5d5145fc'
          VITE_NOUNV2_TREASURY_ADDRESS: '0x2cdeb0d251674710840d9fa990d1de138dfe7c00'
        run: npx netlify build --filter @nouns/webapp --context "${{ steps.site.outputs.context }}"

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        shell: bash
        # Run from the netlify base directory so the CLI picks up
        # `netlify/edge-functions/` via auto-discovery (and the
        # [[edge_functions]] declarations in the root netlify.toml).
        # When the deploy step ran from repo root with `--filter`, edge
        # functions were bundled but never made it into the deploy
        # archive — `available_functions` came back empty in the deploy
        # API response. Working from packages/nouns-webapp fixes that.
        working-directory: packages/nouns-webapp
        run: |
          if [ "${{ steps.site.outputs.prod }}" = "true" ]; then
            npx netlify deploy \
              --site "${{ steps.site.outputs.site_id }}" \
              --prod \
              --dir dist \
              --functions netlify/functions \
              --no-build \
              --message "GitHub Actions ${GITHUB_SHA}"
          else
            npx netlify deploy \
              --site "${{ steps.site.outputs.site_id }}" \
              --prod \
              --dir dist \
              --functions netlify/functions \
              --no-build \
              --message "GitHub Actions ${GITHUB_SHA}"
          fi
