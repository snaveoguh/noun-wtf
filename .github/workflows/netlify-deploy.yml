name: Netlify Deploy

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select site
        id: site
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "site_id=${{ secrets.NETLIFY_SITE_PROD }}" >> "$GITHUB_OUTPUT"
            echo "context=production" >> "$GITHUB_OUTPUT"
            echo "prod=true" >> "$GITHUB_OUTPUT"
          else
            echo "site_id=${{ secrets.NETLIFY_SITE_STAGING }}" >> "$GITHUB_OUTPUT"
            echo "context=branch:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prod=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build with Netlify context
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ steps.site.outputs.site_id }}
        run: npx netlify build --context "${{ steps.site.outputs.context }}"

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        shell: bash
        run: |
          if [ "${{ steps.site.outputs.prod }}" = "true" ]; then
            npx netlify deploy \
              --site "${{ steps.site.outputs.site_id }}" \
              --prod \
              --context production \
              --dir packages/nouns-webapp/dist \
              --functions packages/nouns-webapp/netlify/functions \
              --no-build \
              --message "GitHub Actions ${GITHUB_SHA}"
          else
            npx netlify deploy \
              --site "${{ steps.site.outputs.site_id }}" \
              --context "${{ steps.site.outputs.context }}" \
              --dir packages/nouns-webapp/dist \
              --functions packages/nouns-webapp/netlify/functions \
              --no-build \
              --message "GitHub Actions ${GITHUB_SHA}"
          fi
